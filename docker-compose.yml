# API + dashboard. The database is your Neon PostgreSQL, read from DATABASE_URL in backend/.env.local
# (or backend/.env). No database runs in Docker.
#   docker compose up --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8001/docs
services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.local
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8001:8001"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001/api
        NEXT_PUBLIC_WS_URL: ws://localhost:8001/ws
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  uploads:
