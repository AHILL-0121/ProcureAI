name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q   # uses a temporary SQLite file, never your Neon database
      - name: Migrations match the models
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci.db   # throwaway schema check only; the app itself requires Neon
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:colors
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
